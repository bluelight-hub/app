version: '3.8'

services:
  # PostgreSQL test database - default configuration with persistent volume
  postgres-test:
    image: postgres:15
    container_name: bluelight-test-postgres
    environment:
      POSTGRES_DB: bluelight_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - '5433:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U testuser -d bluelight_test' ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - test-network

  # PostgreSQL with ephemeral storage (in-memory tmpfs) for faster test runs
  postgres-test-ephemeral:
    image: postgres:15
    container_name: bluelight-test-postgres
    profiles:
      - ephemeral
    environment:
      POSTGRES_DB: bluelight_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - '5433:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U testuser -d bluelight_test' ]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data:size=256M
    networks:
      - test-network

volumes:
  postgres-test-data:

networks:
  test-network:
    driver: bridge
# Usage:
# Default (persistent storage): docker-compose -f docker-compose.test.yml up
# Ephemeral (in-memory storage): docker-compose -f docker-compose.test.yml --profile ephemeral up
#
# The ephemeral profile uses tmpfs for PostgreSQL, providing faster test execution and ensuring no state leaks between test runs.
