# Kubernetes Deployment für Bluelight Hub
# Anwendung: kubectl apply -f k8s/bluelight-hub.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: bluelight-hub

---
# Secret für sensible Daten
apiVersion: v1
kind: Secret
metadata:
  name: bluelight-hub-secrets
  namespace: bluelight-hub
type: Opaque
stringData:
  DATABASE_USER: bluelight
  DATABASE_PASSWORD: bluelight  # In Produktion: sicheres Passwort verwenden!

---
# ConfigMap für Konfiguration
apiVersion: v1
kind: ConfigMap
metadata:
  name: bluelight-hub-config
  namespace: bluelight-hub
data:
  DATABASE_NAME: bluelight-hub
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  NODE_ENV: production

---
# PersistentVolumeClaim für PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: bluelight-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PersistentVolumeClaim für Uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: bluelight-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bluelight-hub
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate  # Wichtig für Datenbanken mit PVC
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bluelight-hub-secrets
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bluelight-hub-secrets
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bluelight-hub-config
                  key: DATABASE_NAME
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bluelight
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bluelight
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bluelight-hub
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluelight-hub-app
  namespace: bluelight-hub
  labels:
    app: bluelight-hub-app
spec:
  replicas: 2  # Skalierbar
  selector:
    matchLabels:
      app: bluelight-hub-app
  template:
    metadata:
      labels:
        app: bluelight-hub-app
    spec:
      initContainers:
        # Warten bis PostgreSQL bereit ist
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Warte auf PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL ist bereit!"
      containers:
        - name: app
          image: bluelight-hub:latest  # Image Registry anpassen!
          imagePullPolicy: Always
          ports:
            - containerPort: 3091
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: bluelight-hub-config
                  key: NODE_ENV
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: bluelight-hub-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: bluelight-hub-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: bluelight-hub-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: bluelight-hub-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bluelight-hub-secrets
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3091
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3091
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc

---
# App Service
apiVersion: v1
kind: Service
metadata:
  name: bluelight-hub-app
  namespace: bluelight-hub
spec:
  selector:
    app: bluelight-hub-app
  ports:
    - port: 3091
      targetPort: 3091
  type: ClusterIP

---
# Ingress (optional - für externen Zugriff)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bluelight-hub-ingress
  namespace: bluelight-hub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: bluelight-hub.example.com  # Domain anpassen!
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bluelight-hub-app
                port:
                  number: 3091
