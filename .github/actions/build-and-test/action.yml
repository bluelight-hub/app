name: 'Build and Test'
description: 'Reusable build and test steps for CI and Release workflows'

inputs:
  skip-tests:
    description: 'Skip running tests'
    required: false
    default: 'false'
  skip-frontend-build:
    description: 'Skip frontend build'
    required: false
    default: 'false'
  skip-backend-build:
    description: 'Skip backend build'
    required: false
    default: 'false'
  database-url:
    description: 'PostgreSQL connection string for integration tests'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: |
        # Set environment variable to skip Puppeteer download
        pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      shell: bash
      run: pnpm --filter @bluelight-hub/backend prisma:generate

    - name: Run Prisma migrations
      if: inputs.database-url != ''
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: pnpm --filter @bluelight-hub/backend prisma:deploy

    - name: Build shared package
      shell: bash
      run: pnpm --filter @bluelight-hub/shared build:ci

    - name: Build backend
      if: inputs.skip-backend-build == 'false'
      shell: bash
      run: pnpm --filter @bluelight-hub/backend build

    - name: Build frontend
      if: inputs.skip-frontend-build == 'false'
      shell: bash
      run: pnpm --filter @bluelight-hub/frontend build

    - name: Run linter
      if: inputs.skip-tests == 'false'
      shell: bash
      run: pnpm lint:check

    - name: Check circular dependencies
      if: inputs.skip-tests == 'false'
      shell: bash
      run: pnpm --filter @bluelight-hub/backend lint:deps:core

    - name: Run tests with coverage
      if: inputs.skip-tests == 'false'
      shell: bash
      env:
        JWT_SECRET: test-secret
        JWT_REFRESH_SECRET: test-refresh-secret
        NODE_ENV: test
        DATABASE_URL: ${{ inputs.database-url }}
      run: |
        # Run all tests (including integration) if DATABASE_URL is set, otherwise unit tests only
        if [ -n "$DATABASE_URL" ]; then
          echo "🔗 DATABASE_URL set - running all tests including integration tests"
          pnpm --filter @bluelight-hub/backend test:cov
        else
          echo "⚠️ DATABASE_URL not set - running unit tests only (skipping integration/e2e)"
          pnpm --filter @bluelight-hub/backend test:unit
        fi
        pnpm --filter @bluelight-hub/frontend test:cov