name: Release
run-name: Release ${{ github.ref_name }}#${{ github.run_number }}
on:
  workflow_run:
    workflows: ['CI Pipeline']
    branches: [main, alpha, beta, next]
    types:
      - completed

# Nur ein Release gleichzeitig pro Branch - veraltetes Release wird abgebrochen
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  check-test-success:
    name: Check Test Success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Test success confirmed
        run: echo "Tests were successful, proceeding with release"

  build-backend:
    name: Build Backend ${{ matrix.variant }} (${{ matrix.platform }})
    needs: [check-test-success]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # App image (production target)
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: production
            variant: app
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: production
            variant: app
          # Migrations image
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: migrations
            variant: migrations
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: migrations
            variant: migrations
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        run: |
          if [ "${{ matrix.variant }}" = "app" ]; then
            echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.platform }}-${{ matrix.variant }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-backend:
    name: Merge Backend Images (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: app
            image_suffix: ''
          - variant: migrations
            image_suffix: '/migrations'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tags
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" = "main" ]; then
            {
              echo "TAGS<<EOF"
              echo "type=raw,value=latest"
              echo "type=raw,value=main"
              echo "EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "TAGS<<EOF"
              echo "type=raw,value=${BRANCH}"
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: ${{ env.TAGS }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}@sha256:%s ' *)

      - name: Save Docker image tags
        if: matrix.variant == 'app'
        run: echo "${{ steps.meta.outputs.tags }}" > backend-image-tags.txt

      - name: Save Migrations image tags
        if: matrix.variant == 'migrations'
        run: echo "${{ steps.meta.outputs.tags }}" > migrations-image-tags.txt

      - name: Upload Backend Image Tags
        if: matrix.variant == 'app'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-tags
          path: backend-image-tags.txt

      - name: Upload Migrations Image Tags
        if: matrix.variant == 'migrations'
        uses: actions/upload-artifact@v7
        with:
          name: migrations-image-tags
          path: migrations-image-tags.txt

  build-frontend:
    name: Build Frontend on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            artifact_suffix: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            artifact_suffix: 'macos-x64'
          - platform: 'ubuntu-latest'
            args: ''
            artifact_suffix: 'ubuntu'
          - platform: 'windows-latest'
            args: ''
            artifact_suffix: 'windows'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      # Use reusable build action for dependencies
      - name: Setup Build Environment
        uses: ./.github/actions/build-and-test
        with:
          platform: ${{ matrix.platform }}
          skip-tests: 'true'
          skip-backend-build: 'true'
          skip-frontend-build: 'true'

      - name: Prepare Windows Version (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Function to get only major.minor.patch
          function Get-BaseVersion {
              param($version)
              if ($version -match '(\d+\.\d+\.\d+)') {
                  return $matches[1]
              }
              return $version
          }

          # Update package.json
          $packageContent = Get-Content packages/frontend/package.json -Raw
          $packageJson = $packageContent | ConvertFrom-Json
          $packageJson.version = Get-BaseVersion $packageJson.version
          $packageJson | ConvertTo-Json -Depth 32 | Set-Content packages/frontend/package.json

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/frontend
          args: ${{ matrix.args }}

      - name: Find bundle path
        id: bundle
        shell: bash
        run: |
          # Find the actual bundle directory (handles both native and cross-compilation)
          BUNDLE_PATH=$(find packages/frontend/src-tauri/target -type d -name "bundle" -path "*/release/*" | grep -v "/doc/" | head -1)
          echo "path=$BUNDLE_PATH" >> $GITHUB_OUTPUT
          echo "Bundle path: $BUNDLE_PATH"
          ls -la "$BUNDLE_PATH"

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-artifact-${{ matrix.artifact_suffix }}
          path: ${{ steps.bundle.outputs.path }}

  release:
    name: Create Release
    needs: [merge-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: releases
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Use reusable build action for setup
      - name: Setup Release Environment
        uses: ./.github/actions/build-and-test
        with:
          skip-tests: 'true'
          skip-backend-build: 'true'
          skip-frontend-build: 'true'

      - name: Download Backend Image Tags
        uses: actions/download-artifact@v8
        with:
          name: backend-image-tags

      - name: Download Migrations Image Tags
        uses: actions/download-artifact@v8
        with:
          name: migrations-image-tags

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v8
        with:
          path: frontend-artifacts
          pattern: frontend-artifact-*

      - name: Prepare Release Notes
        run: |
          echo "## Docker Image Tags" >> RELEASE_NOTES.md
          echo "### App" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          cat backend-image-tags.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Migrations" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          cat migrations-image-tags.txt >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Frontend Artifacts" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          ls -R frontend-artifacts/frontend-artifact-* >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_NOTES: ${{ github.workspace }}/RELEASE_NOTES.md
          HUSKY: '0'
        run: npx semantic-release

      - name: Get released version
        id: version
        run: |
          # Check if semantic-release created a version tag on HEAD
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1 || echo '')
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Released version: $VERSION"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release created, skipping Docker re-tagging"
          fi

      - name: Set up Docker Buildx
        if: steps.version.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: steps.version.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker images with release version
        if: steps.version.outputs.released == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          echo "Tagging Docker images with version ${VERSION}"

          # Tag app image with version
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH}"

          # Tag migrations image with version
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrations:${VERSION}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrations:${BRANCH}"
