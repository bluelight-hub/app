name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop, feature/*, alpha, beta, release/* ]
  push:
    branches: [ main, develop, feature/*, alpha, beta, release/* ]

# Cancel in-progress runs when new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Linux build with PostgreSQL database
  build-and-test-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PostgreSQL service nur für Linux verfügbar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Run Prisma migrations
        run: pnpm --filter @bluelight-hub/backend prisma:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      # Use our reusable build action
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          skip-tests: 'false'
          database-url: 'postgresql://test:test@localhost:5432/testdb'

      # Upload test artifacts on failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-linux
          path: |
            packages/frontend/test-results/
            packages/backend/coverage/
            packages/frontend/coverage/
            **/trace.zip

      # Coverage upload
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: |
            packages/backend/coverage/lcov.info
            packages/frontend/coverage/lcov.info
          flags: unittests
          name: codecov-Linux
          fail_ci_if_error: false

  # macOS and Windows builds without database
  build-and-test-other:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        include:
          - os: macos-latest
            platform_name: 'macOS'
          - os: windows-latest
            platform_name: 'Windows'

    steps:
      - uses: actions/checkout@v6

      # Use our reusable build action
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          skip-tests: ${{ matrix.os == 'windows-latest' && 'true' || 'false' }}

      # Upload test artifacts on failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.os }}
          path: |
            packages/frontend/test-results/
            packages/backend/coverage/
            packages/frontend/coverage/
            **/trace.zip

  # Documentation Build (optional, non-blocking)
  docs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Build documentation
        run: pnpm --filter @bluelight-hub/backend docs:build

      - name: Check JSDoc coverage
        run: pnpm --filter @bluelight-hub/backend check:jsdoc:public || true

  # Code Quality Check (optional, non-blocking)
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Run TypeScript compiler check
        run: |
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          pnpm install --frozen-lockfile
          pnpm lint:check

  # Summary job for branch protection
  summary:
    name: CI Pipeline Summary
    needs: [ build-and-test-linux, build-and-test-other ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all matrix jobs
        run: |
          if [[ "${{ needs.build-and-test-linux.result }}" != "success" ]] || [[ "${{ needs.build-and-test-other.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed"

      - name: Create summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test (Linux) | ${{ needs.build-and-test-linux.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test (Other) | ${{ needs.build-and-test-other.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Results" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: Complete (with PostgreSQL)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: Complete (tests skipped)" >> $GITHUB_STEP_SUMMARY