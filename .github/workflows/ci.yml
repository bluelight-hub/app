name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop, feature/*, alpha, beta, release/* ]
  push:
    branches: [ main, develop, feature/*, alpha, beta, release/* ]

# Cancel in-progress runs when new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Detect which files changed to skip unnecessary jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'packages/*/package.json'

  # Linux build with PostgreSQL database
  build-and-test-linux:
    name: Build and Test (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PostgreSQL service nur für Linux verfügbar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      # Use our reusable build action (handles pnpm, node, deps, prisma generate + migrate, build, test)
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          skip-tests: 'false'
          database-url: 'postgresql://test:test@localhost:5432/testdb'

      # Upload test artifacts on failure
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-artifacts-linux
          path: |
            packages/frontend/test-results/
            packages/backend/coverage/
            packages/frontend/coverage/
            **/trace.zip

      # Coverage upload
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: |
            packages/backend/coverage/lcov.info
            packages/frontend/coverage/lcov.info
          flags: unittests
          name: codecov-Linux
          fail_ci_if_error: false

  # macOS and Windows builds without database
  build-and-test-other:
    name: Build and Test (${{ matrix.os }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        include:
          - os: macos-latest
            platform_name: 'macOS'
          - os: windows-latest
            platform_name: 'Windows'

    steps:
      - uses: actions/checkout@v6

      # Use our reusable build action
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          skip-tests: ${{ matrix.os == 'windows-latest' && 'true' || 'false' }}

      # Upload test artifacts on failure
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-artifacts-${{ matrix.os }}
          path: |
            packages/frontend/test-results/
            packages/backend/coverage/
            packages/frontend/coverage/
            **/trace.zip

  # Lightweight Checks (Lint + Docs, non-blocking)
  lightweight-checks:
    name: Lightweight Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Build documentation
        run: pnpm --filter @bluelight-hub/backend docs:build

      - name: Check JSDoc coverage
        run: pnpm --filter @bluelight-hub/backend check:jsdoc:public || true

  # Docker build smoke test (no push)
  docker-build:
    name: Docker Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha,scope=docker-build-production
          cache-to: type=gha,scope=docker-build-production,mode=max

      - name: Build migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: false
          cache-from: type=gha,scope=docker-build-migrations
          cache-to: type=gha,scope=docker-build-migrations,mode=max

  # Summary job for branch protection
  summary:
    name: CI Pipeline Summary
    needs: [detect-changes, build-and-test-linux, build-and-test-other, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all matrix jobs
        run: |
          changes="${{ needs.detect-changes.result }}"
          linux="${{ needs.build-and-test-linux.result }}"
          other="${{ needs.build-and-test-other.result }}"
          docker="${{ needs.docker-build.result }}"
          if [[ "$changes" != "success" ]]; then
            echo "❌ Change detection failed: $changes"
            exit 1
          fi
          if [[ "$linux" != "success" && "$linux" != "skipped" ]] || \
             [[ "$other" != "success" && "$other" != "skipped" ]] || \
             [[ "$docker" != "success" && "$docker" != "skipped" ]]; then
            echo "❌ One or more jobs failed"
            echo "Linux: $linux"
            echo "Other: $other"
            echo "Docker: $docker"
            exit 1
          fi
          echo "✅ All CI checks passed"

      - name: Create summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          linux="${{ needs.build-and-test-linux.result }}"
          other="${{ needs.build-and-test-other.result }}"
          docker="${{ needs.docker-build.result }}"

          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              *) echo "❌" ;;
            esac
          }

          echo "| Build & Test (Linux) | $(status_icon "$linux") $linux |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test (Other) | $(status_icon "$other") $other |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | $(status_icon "$docker") $docker |" >> $GITHUB_STEP_SUMMARY
          echo "| Lightweight Checks | ℹ️ non-blocking |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Results" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: $linux (with PostgreSQL)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: $other" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: $other (tests skipped)" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: $docker" >> $GITHUB_STEP_SUMMARY