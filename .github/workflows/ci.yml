name: CI Pipeline

on:
  pull_request:
    branches: [main, develop, feature/*, alpha, beta, release/*]
  push:
    branches: [main, develop, feature/*, alpha, beta, release/*]

# Cancel in-progress runs when new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Detect which files changed to skip unnecessary jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'packages/*/package.json'

  # Repository hygiene gate for backup/merge artifact files
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check repository hygiene
        run: bash ./scripts/check-repo-hygiene.sh

  # Commit message quality gate: validates all commits in PR/push ranges
  commit-message-validation:
    name: Commit Message Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Determine commit range
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            git fetch --no-tags --prune --depth=200 origin "$DEFAULT_BRANCH"

            if MERGE_BASE="$(git merge-base "origin/$DEFAULT_BRANCH" "${{ github.sha }}" 2>/dev/null)" && [ -n "$MERGE_BASE" ]; then
              COMMIT_RANGE="${MERGE_BASE}..${{ github.sha }}"
            elif git rev-parse --verify "${{ github.sha }}^" >/dev/null 2>&1; then
              COMMIT_RANGE="${{ github.sha }}^..${{ github.sha }}"
            else
              COMMIT_RANGE="${{ github.sha }}..${{ github.sha }}"
            fi
          fi

          echo "COMMIT_RANGE=$COMMIT_RANGE" >> "$GITHUB_ENV"
          echo "Using COMMIT_RANGE=$COMMIT_RANGE"

      - name: Validate commit messages
        run: node scripts/check-commit-range.mjs --range "$COMMIT_RANGE"

  # Linux quality gate: build + lint + architecture checks
  linux-quality:
    name: Linux Quality (Build + Lint)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Build shared package
        run: pnpm --filter @bluelight-hub/shared build:ci

      - name: Build backend
        run: pnpm --filter @bluelight-hub/backend build

      - name: Build frontend
        run: pnpm --filter @bluelight-hub/frontend build

      - name: Run linter
        run: pnpm lint:check

      - name: Check circular dependencies
        run: pnpm --filter @bluelight-hub/backend lint:deps:core

  # Linux backend unit tests (fast lane, no DB) — split across shards
  linux-backend-unit:
    name: Linux Backend Unit (Shard ${{ matrix.shard }}/3)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      # Threshold-Enforcement pro Shard deaktiviert — jeder Shard sieht nur
      # einen Teil der Tests, daher ist seine Coverage unvollständig. Codecov
      # merged die Shards zentral, die Threshold-Prüfung passiert dort.
      #
      # `pnpm exec jest` (statt `pnpm test:unit -- …`) verhindert, dass pnpm
      # `--shard` hinter ein `--` hängt. Sonst interpretiert Jest das Flag als
      # positional Test-Pfad-Pattern → "No tests found".
      - name: Run backend unit tests (sharded)
        env:
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          pnpm --filter @bluelight-hub/backend exec jest \
            --coverage \
            --testPathIgnorePatterns='\.integration\.spec\.ts$' \
            --testPathIgnorePatterns='\.e2e\.spec\.ts$' \
            --testPathIgnorePatterns='\.smoke\.spec\.ts$' \
            --shard="$SHARD_INDEX/3" \
            --coverageThreshold='{}'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts-linux-backend-unit-shard-${{ matrix.shard }}
          path: |
            packages/backend/coverage/
            **/trace.zip

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: packages/backend/coverage/lcov.info
          flags: backend-unit
          name: codecov-linux-backend-unit-shard-${{ matrix.shard }}
          fail_ci_if_error: false

  # Linux backend database tests split across shards
  linux-backend-db:
    name: Linux Backend DB (Shard ${{ matrix.shard }}/3)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        run: pnpm --filter @bluelight-hub/backend prisma:deploy

      - name: Run backend DB tests (sharded)
        env:
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          # VAPID-Stubs nur für Test-Bootstrap (kein echter Push-Versand).
          # PushNotificationsModule.onModuleInit prüft Fail-Fast (AC3) und
          # bricht sonst alle e2e/integration Tests ab, die Nest booten.
          VAPID_PUBLIC_KEY: BFXVdS1XbF4WsymeQ8ALDXxPjBS8WBXOGZuxw5Z_K-eqTMA4Y3srt2DfeQuUOjIma376b026FqKG7YpRKOxnwCg
          VAPID_PRIVATE_KEY: eQLRNH_aGO0c69kvha8CEKiomjs7_vGwgrFwwIPFN-E
          VAPID_SUBJECT: 'mailto:ci@bluelight-hub.test'
        run: pnpm --filter @bluelight-hub/backend test:db -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts-linux-backend-db-shard-${{ matrix.shard }}
          path: |
            packages/backend/coverage/
            **/trace.zip

  # Linux end-to-end tests (Story 7.11) — Playwright gegen Out-of-Process-Backend + vite preview
  linux-e2e:
    name: Linux E2E (Playwright)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        run: pnpm --filter @bluelight-hub/backend prisma:deploy

      - name: Build shared package
        run: pnpm --filter @bluelight-hub/shared build

      - name: Build backend
        run: pnpm --filter @bluelight-hub/backend build

      # P18 (Review): VITE_API_BASE_URL wird zur Build-Zeit inlined. Wer
      # E2E_BACKEND_PORT umstellt, muss diesen Wert hier ebenfalls anpassen, sonst läuft
      # `vite preview` weiterhin gegen :3091. Dokumentation siehe Audit-Bericht Sektion 1.
      - name: Build frontend (with VITE_API_BASE_URL pinned for vite preview)
        env:
          VITE_API_BASE_URL: http://127.0.0.1:3091/api
        run: pnpm --filter @bluelight-hub/frontend build

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @bluelight-hub/frontend exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        env:
          NODE_ENV: test
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          E2E_BACKEND_PORT: '3091'
          E2E_FRONTEND_PORT: '4173'
          # VAPID-Stubs für den Out-of-Process-Backend-Bootstrap; ohne diese
          # bricht PushNotificationsModule.onModuleInit (AC3, Fail-Fast).
          VAPID_PUBLIC_KEY: BFXVdS1XbF4WsymeQ8ALDXxPjBS8WBXOGZuxw5Z_K-eqTMA4Y3srt2DfeQuUOjIma376b026FqKG7YpRKOxnwCg
          VAPID_PRIVATE_KEY: eQLRNH_aGO0c69kvha8CEKiomjs7_vGwgrFwwIPFN-E
          VAPID_SUBJECT: 'mailto:ci@bluelight-hub.test'
        run: pnpm --filter @bluelight-hub/frontend test:e2e:ci

      # P28 (Review): `if: always()` greift auch bei Setup-Phase-Failures (DB unreachable,
      # spawn ENOENT) — sonst stehen keine Diagnose-Artifacts zur Verfügung.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-artifacts-linux-e2e
          path: |
            packages/frontend/playwright-report/
            packages/frontend/test-results/
            **/trace.zip

  # Linux frontend tests — split across shards (Performance-Gates laufen separat)
  linux-frontend:
    name: Linux Frontend (Shard ${{ matrix.shard }}/3)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bluelight-hub/shared build

      - name: Run frontend tests (sharded)
        env:
          NODE_ENV: test
          SHARD_INDEX: ${{ matrix.shard }}
          # Mehrere Specs (z. B. VorfallDetailPage Story 5.6) assertieren
          # konkrete Berlin-Zeit-Strings. CI-Runner laufen in UTC, lokal sind
          # die Tests CEST/CET — TZ explizit pinnen, damit Datums-Renderings
          # in jedem Lauf identisch sind.
          TZ: Europe/Berlin
        run: |
          pnpm --filter @bluelight-hub/frontend exec vitest \
            --run \
            --coverage \
            --reporter=default \
            --reporter=junit \
            --outputFile="test-report.junit.shard-$SHARD_INDEX.xml" \
            --shard="$SHARD_INDEX/3"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts-linux-frontend-shard-${{ matrix.shard }}
          path: |
            packages/frontend/test-results/
            packages/frontend/coverage/
            **/trace.zip

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: packages/frontend/coverage/lcov.info
          flags: frontend
          name: codecov-linux-frontend-shard-${{ matrix.shard }}
          fail_ci_if_error: false

      - name: Upload frontend test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/frontend/test-report.junit.shard-${{ matrix.shard }}.xml

  # Frontend performance gates — timing-sensitiv, daher isoliert ohne Shard-Konkurrenz
  linux-frontend-performance:
    name: Linux Frontend Performance
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bluelight-hub/shared build

      - name: Run frontend performance gates
        env:
          NODE_ENV: test
        run: pnpm --filter @bluelight-hub/frontend test:performance

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts-linux-frontend-performance
          path: |
            packages/frontend/test-results/
            **/trace.zip

  # Lightweight Checks (Lint + Docs, non-blocking)
  lightweight-checks:
    name: Lightweight Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bluelight-hub/backend prisma:generate

      - name: Build documentation
        run: pnpm --filter @bluelight-hub/backend docs:build

      - name: Check JSDoc coverage
        run: pnpm --filter @bluelight-hub/backend check:jsdoc:public || true

  # Docker build smoke test (no push)
  docker-build:
    name: Docker Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha,scope=docker-build-production
          cache-to: type=gha,scope=docker-build-production,mode=max

      - name: Build migrations image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrations
          push: false
          cache-from: type=gha,scope=docker-build-migrations
          cache-to: type=gha,scope=docker-build-migrations,mode=max

  # Summary job for branch protection
  summary:
    name: CI Pipeline Summary
    needs: [detect-changes, repo-hygiene, linux-quality, linux-backend-unit, linux-backend-db, linux-e2e, linux-frontend, linux-frontend-performance, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all matrix jobs
        run: |
          changes="${{ needs.detect-changes.result }}"
          hygiene="${{ needs.repo-hygiene.result }}"
          quality="${{ needs.linux-quality.result }}"
          backend_unit="${{ needs.linux-backend-unit.result }}"
          backend_db="${{ needs.linux-backend-db.result }}"
          e2e="${{ needs.linux-e2e.result }}"
          frontend="${{ needs.linux-frontend.result }}"
          frontend_perf="${{ needs.linux-frontend-performance.result }}"
          docker="${{ needs.docker-build.result }}"
          if [[ "$changes" != "success" ]]; then
            echo "❌ Change detection failed: $changes"
            exit 1
          fi
          if [[ "$hygiene" != "success" ]]; then
            echo "❌ Repository hygiene failed: $hygiene"
            exit 1
          fi
          if [[ "$quality" != "success" && "$quality" != "skipped" ]] || \
             [[ "$backend_unit" != "success" && "$backend_unit" != "skipped" ]] || \
             [[ "$backend_db" != "success" && "$backend_db" != "skipped" ]] || \
             [[ "$e2e" != "success" && "$e2e" != "skipped" ]] || \
             [[ "$frontend" != "success" && "$frontend" != "skipped" ]] || \
             [[ "$frontend_perf" != "success" && "$frontend_perf" != "skipped" ]] || \
             [[ "$docker" != "success" && "$docker" != "skipped" ]]; then
            echo "❌ One or more jobs failed"
            echo "Repository Hygiene: $hygiene"
            echo "Linux Quality: $quality"
            echo "Linux Backend Unit: $backend_unit"
            echo "Linux Backend DB: $backend_db"
            echo "Linux E2E: $e2e"
            echo "Linux Frontend: $frontend"
            echo "Linux Frontend Performance: $frontend_perf"
            echo "Docker: $docker"
            exit 1
          fi
          echo "✅ All CI checks passed"

      - name: Create summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          hygiene="${{ needs.repo-hygiene.result }}"
          quality="${{ needs.linux-quality.result }}"
          backend_unit="${{ needs.linux-backend-unit.result }}"
          backend_db="${{ needs.linux-backend-db.result }}"
          e2e="${{ needs.linux-e2e.result }}"
          frontend="${{ needs.linux-frontend.result }}"
          frontend_perf="${{ needs.linux-frontend-performance.result }}"
          docker="${{ needs.docker-build.result }}"

          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              *) echo "❌" ;;
            esac
          }

          echo "| Repository Hygiene | $(status_icon "$hygiene") $hygiene |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Quality (Build + Lint) | $(status_icon "$quality") $quality |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Backend Unit (3 Shards) | $(status_icon "$backend_unit") $backend_unit |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Backend DB (3 Shards) | $(status_icon "$backend_db") $backend_db |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux E2E (Playwright) | $(status_icon "$e2e") $e2e |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Frontend Tests (3 Shards) | $(status_icon "$frontend") $frontend |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Frontend Performance | $(status_icon "$frontend_perf") $frontend_perf |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | $(status_icon "$docker") $docker |" >> $GITHUB_STEP_SUMMARY
          echo "| Lightweight Checks | ℹ️ non-blocking |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Linux Test Strategy" >> $GITHUB_STEP_SUMMARY
          echo "- Alle verpflichtenden Tests laufen auf Linux" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Unit + DB und Frontend Tests jeweils 3-fach gesharded" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Performance-Gates isoliert in eigenem Job" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: $docker" >> $GITHUB_STEP_SUMMARY
