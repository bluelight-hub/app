# CodeQL Configuration
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning

name: 'CodeQL Config for bluelight-hub'

# Exclude paths from analysis where security rules don't apply
paths-ignore:
  # Test files - don't analyze test code for security vulnerabilities
  - '**/__tests__/**'
  - '**/*.spec.ts'
  - '**/*.test.ts'
  - '**/test/**'

# Query filters to suppress known false positives
query-filters:
  # HIBP SHA-1 False Positive Suppression
  # The HIBP service uses SHA-1 for k-Anonymity API protocol, NOT for password storage.
  # Passwords are stored separately using bcrypt (NIST SP 800-63B-4 compliant).
  # Only the first 5 characters of the SHA-1 hash are sent to the HIBP API.
  # See: https://haveibeenpwned.com/API/v3#PwnedPasswords
  - exclude:
      id: js/insufficient-password-hash
      path-pattern: '**/infrastructure/password/hibp.service.ts'
