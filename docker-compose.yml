services:
  postgres:
    image: postgres:18
    container_name: bluelight-hub-postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DATABASE_USER:-bluelight}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-bluelight}
      - POSTGRES_DB=${DATABASE_NAME:-bluelight-hub}
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-3092}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluelight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrations:
    image: ${MIGRATIONS_IMAGE:-ghcr.io/rubenvitt/bluelight-hub/migrations:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-bluelight}:${DATABASE_PASSWORD:-bluelight}@postgres:5432/${DATABASE_NAME:-bluelight-hub}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - full-app

  app:
    image: ${APP_IMAGE:-ghcr.io/rubenvitt/bluelight-hub:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3091:3091"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-bluelight}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-bluelight}
      - DATABASE_NAME=${DATABASE_NAME:-bluelight-hub}
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full-app
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3091/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  postgres_data:
    name: bluelight-hub-postgres-data
