# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "use sub agents"
  - "Load and strictly follow {project-root}/docs/architecture-principles.md for all architectural decisions and story validation"

# Add persistent memories for the agent
memories:
  - "The project has architecture principles documented in {project-root}/docs/architecture-principles.md — always load and reference this document when validating stories, planning sprints, or reviewing implementation readiness."

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
